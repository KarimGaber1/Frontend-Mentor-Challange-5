<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style/main.css">
    <title>Huddle</title>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <div class="nav-logo">
                    <a href="#"><img src="./assets/images/logo.svg" alt=""></a>
                </div>
            </nav>
            <div class="header-content">
                <div class="header-content-img">
                    <img src="./assets/images/illustration-mockups.svg" alt="Huddle Mockups image">
                </div>
                <div class="header-content-caption">
                    <h1>Build The Community Your Fans Will Love</h1>
                    <p>Huddle re-imagines the way we build communities. You have a voice, but so does your audience.
                        Create connections with your users as you engage in genuine discussion.</p>
                    <button class="header-btn">Register</button>
                </div>
            </div>
        </div>
        <div class="header-icons">
            <ul>
                <li><i class="fa-brands fa-facebook-f fa-"></i></li>
                <li><i class="fa-brands fa-twitter"></i></li>
                <li> <i class="fa-brands fa-instagram"></i></li>
            </ul>
        </div>

    </header>
</body>

</html>
